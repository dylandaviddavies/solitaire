<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so this also works as a maskable icon. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Card silhouette, kept within the ~80% maskable safe zone. -->
  <g transform="translate(256 256)">
    <rect x="-108" y="-148" width="216" height="296" rx="28" fill="#fffaf0" stroke="rgba(0,0,0,0.15)" stroke-width="6"/>
    <text x="0" y="58" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="190" font-weight="900" text-anchor="middle" fill="#1e293b">&#9824;</text>
  </g>
</svg>
